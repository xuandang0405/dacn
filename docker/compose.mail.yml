services:
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 100
  backend:
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: smart-task@demo.local
      SMTP_STARTTLS: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
    depends_on:
      mailpit:
        condition: service_started
