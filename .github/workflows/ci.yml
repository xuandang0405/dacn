name: MVP checks
on:
  pull_request:
    branches: [main, develop, "integration/mvp"]
  push:
    branches: [develop, "integration/mvp"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Backend MySQL 8
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-database-password
          MYSQL_DATABASE: smart_task_ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-database-password --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DATABASE_URL: mysql+pymysql://root:ci-database-password@127.0.0.1:3306/smart_task_ci?charset=utf8mb4
      JWT_SECRET: ci-only-key-never-use-this-value-in-a-deployment
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
      - run: pip install -r backend/requirements.txt
      - name: Fresh migration and regression tests
        working-directory: backend
        run: python tests/run_verification.py --skip-load --output-dir ../test-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-test-results
          path: test-results/
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm run lint && npm test && npm audit --audit-level=moderate
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  browser:
    name: Website and Docker workflows
    runs-on: ubuntu-latest
    env:
      E2E_OUTPUT_DIR: ${{ github.workspace }}/test-results/browser
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start isolated MySQL, API, UI, scheduler and local SMTP
        run: |
          python3 scripts/setup_demo_env.py
          docker compose -p dacn-ci -f docker-compose.yml -f docker/compose.mail.yml up -d --build --wait --wait-timeout 240
      - name: Check the four modules through real HTTP and WebSocket
        run: |
          mkdir -p test-results/smoke
          for module in auth ai task insights; do
            docker compose -p dacn-ci -f docker-compose.yml -f docker/compose.mail.yml -f docker/compose.${module}-checks.yml run --rm --no-deps -T ${module}-checks > test-results/smoke/${module}.json
          done
      - name: Install browser tests
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Test owner and member UI workflows
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: website-test-results
          path: test-results/
      - name: Stop the test stack
        if: always()
        run: docker compose -p dacn-ci -f docker-compose.yml -f docker/compose.mail.yml down
