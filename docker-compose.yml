services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_task_manager}
      MYSQL_USER: ${MYSQL_USER:-smart_task}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --log-bin-trust-function-creators=1
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-smart_task}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-smart_task_manager}?charset=utf8mb4
      DOCUMENT_STORAGE_DIR: /data/project_documents
    volumes:
      - project_documents:/data/project_documents
    ports:
      - "8000:8000"
    depends_on:
      initialize:
        condition: service_completed_successfully
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
  scheduler:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-smart_task}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-smart_task_manager}?charset=utf8mb4
    depends_on:
      backend:
        condition: service_healthy
    command: python -m app.jobs.deadlines
  initialize:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-smart_task}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-smart_task_manager}?charset=utf8mb4
      DEMO_PASSWORD: ${DEMO_PASSWORD:-STM-Demo-Only-2026!}
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c 'alembic upgrade head && if [ "$${SEED_DEMO:-true}" = "true" ]; then python seed.py; fi'
    restart: "no"
  database-admin:
    image: adminer:5
    profiles: [tools]
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql_data:
  project_documents:
